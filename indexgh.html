<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ภารกิจของฉัน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Sarabun",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#06c755;color:#fff;padding:12px 16px;font-weight:600}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:0;background:none;font:inherit;border-bottom:3px solid transparent}
nav button.on{border-color:#06c755;font-weight:600}
main{padding:12px;max-width:560px;margin:auto}.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
label{display:block;font-size:13px;color:#666;margin:10px 0 3px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:#06c755;color:#fff;font:inherit;font-weight:600}
.btn:disabled{background:#aaa}.hide{display:none}small{color:#666}
.big{font-size:28px;font-weight:700;color:#06a047}table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 2px;border-bottom:1px solid #eee}.msg{padding:10px;border-radius:8px;margin-bottom:10px;background:#e8f9ee}.err{background:#fdeaea}
</style></head><body>
<header id="hd">🚑 ภารกิจของฉัน</header>
<main>
<div id="msg" class="msg hide"></div>
<div id="load" class="card">กำลังโหลด…</div>

<div id="reg" class="card hide">
  <b>ลงทะเบียนครั้งแรก</b>
  <label>ชื่อ-นามสกุลที่ใช้ในระบบ</label><input id="rn" autocomplete="name">
  <label>ตำแหน่ง</label><select id="rp"><option>RN</option><option>PN</option></select>
  <button class="btn" id="rb">ลงทะเบียน</button>
</div>

<div id="app" class="hide">
  <nav><button class="on" data-t="f">บันทึกภารกิจ</button><button data-t="s">ยอดของฉัน</button></nav>
  <div id="f" class="card" style="margin-top:12px">
    <label>ชื่อภารกิจ</label><input id="mission">
    <label>วันที่</label><input type="date" id="date">
    <div class="row"><div><label>เวลาออก</label><input type="time" id="start"></div><div><label>เวลาเสร็จสิ้น</label><input type="time" id="end"></div></div>
    <button class="btn" id="ab">บันทึกภารกิจ</button>
  </div>
  <div id="s" class="hide" style="margin-top:12px">
    <div class="card"><small>ชม.คงเหลือที่ยังไม่เบิก</small><div class="big" id="bal"></div><small id="bb"></small><br><small id="tot"></small></div>
    <div class="card"><b>ภารกิจล่าสุด</b><table id="rc"></table></div>
  </div>
</div>
</main>
<script>
// ===== ตั้งค่า 2 ค่านี้ก่อนอัปโหลดขึ้น GitHub =====
const LIFF_ID = 'ใส่ LIFF ID';
const GAS_URL = 'ใส่ URL เว็บแอป Apps Script (ลงท้าย /exec)';
// ===================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const td = i => { const [a,b,c] = i.split('-'); return +c + '/' + +b + '/' + (+a + 543) };
function msg(t, bad) { const m = $('msg'); m.textContent = t; m.className = 'msg' + (bad ? ' err' : ''); }

async function api(action, extra) {
  const r = await fetch(GAS_URL, { method: 'POST',     // text/plain ไม่ต้อง preflight → ใช้กับ Apps Script ได้
    body: JSON.stringify(Object.assign({ action, idToken: liff.getIDToken() }, extra || {})) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}
function show(j) {
  $('load').classList.add('hide');
  $('reg').classList.toggle('hide', !!j.me);
  $('app').classList.toggle('hide', !j.me);
  if (!j.me) return;
  $('hd').textContent = '🚑 ' + j.me.name + ' (' + j.me.pos + ')';
  const s = j.sum;
  $('bal').textContent = s.bal + ' ชม.';
  $('bb').textContent = '≈ ' + s.balBaht.toLocaleString() + ' บาท';
  $('tot').textContent = 'สะสมทั้งหมด ' + s.earned + ' ชม. | เบิกแล้ว ' + s.claimed + ' ชม.';
  $('rc').innerHTML = s.recent.map(r => `<tr><td>${td(r.date)}<br><small>${r.start}-${r.end}</small></td><td>${esc(r.mission)}</td><td>${r.hrs} ชม.</td></tr>`).join('') || '<tr><td>ยังไม่มีข้อมูล</td></tr>';
}
async function run(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (e) { msg(e.message, true); }
  btn.disabled = false;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x == b));
  $('f').classList.toggle('hide', b.dataset.t != 'f'); $('s').classList.toggle('hide', b.dataset.t != 's');
});
$('rb').onclick = () => run($('rb'), async () => { show(await api('register', { name: $('rn').value, pos: $('rp').value })); msg('ลงทะเบียนแล้ว'); });
$('ab').onclick = () => run($('ab'), async () => {
  const j = await api('add', { mission: $('mission').value, date: $('date').value, start: $('start').value, end: $('end').value });
  show(j); msg('✅ บันทึกภารกิจแล้ว');
  ['mission', 'start', 'end'].forEach(i => $(i).value = '');
});
$('date').value = new Date().toLocaleDateString('sv');
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    show(await api('me'));
  } catch (e) { $('load').classList.add('hide'); msg(e.message, true); }
})();
</script></body></html>
